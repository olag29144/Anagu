services:
  besu:
    image: hyperledger/besu:latest
    restart: unless-stopped
    volumes:
      - ./infra/besu:/config
      - besu_data:/data
    command: >
      --data-path=/data
      --genesis-file=/config/genesis.json
      --rpc-http-enabled=true
      --rpc-http-host=0.0.0.0
      --rpc-http-port=8545
      --rpc-http-api=ETH,NET,QBFT,ADMIN,TXPOOL,MINER
      --rpc-http-cors-origins=*
      --rpc-ws-enabled=true
      --rpc-ws-host=0.0.0.0
      --rpc-ws-port=8546
      --host-allowlist=*
      --min-gas-price=0
      --profile=ENTERPRISE
    ports:
      - "8545:8545"
      - "8546:8546"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -sf -X POST
          -H "Content-Type: application/json"
          --data "{\"jsonrpc\":\"2.0\",\"method\":\"net_version\",\"params\":[],\"id\":1}"
          http://localhost:8545 || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mqtt:
    image: emqx/emqx:5
    restart: unless-stopped
    environment:
      EMQX_NAME: anagu-mqtt
      EMQX_HOST: "127.0.0.1"
    ports:
      - "1883:1883"
      - "8083:8083"
      - "18083:18083"
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  besu_data:
